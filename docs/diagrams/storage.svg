<text x="178" y="350" class="p e m">37,608</text>
<text x="186" y="350">5 entries of 40 bytes: offset and time range per frame</text>
<circle cx="659" cy="345.5" r="8.5"/>
<text x="659" y="349.5" class="p c">2</text>
<rect x="0.5" y="364.5" width="131" height="28" rx="3"/>
<text x="10" y="383" class="t"><tspan class="m">END</tspan> frame</text>
<text x="178" y="383" class="p e m">37,872</text>
<text x="186" y="383">last 96 bytes: offset of the <tspan class="m">INDEX</tspan> frame, totals</text>
<circle cx="659" cy="378.5" r="8.5"/>
<text x="659" y="382.5" class="p c">1</text>
<text x="0" y="413" class="p">Query: <tspan class="m">TRADE_QUOTE</tspan> records from 08:03:00 to 08:04:00. Steps 1 to 3 read <tspan class="m">END</tspan>, <tspan class="m">INDEX</tspan> and the summaries. Step 4 reads</text>
<text x="0" y="430" class="p">frames 1 and 2: 228 records, 20,736 of 37,968 bytes.</text>
