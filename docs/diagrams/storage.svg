<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" class="nwt-dg" font-family="inherit" role="img">
<title>How a store file works</title>
<desc>Records are grouped into DATA frames, each with a checksum and optional compression; FRAME_SUMMARY records and the INDEX frame describe every frame, and a query goes from END to INDEX to the summaries and reads only the frames that can match.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-storage-w)}</style>
<defs><marker id="a-storage-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M165.5 36H183.5"/>
<path class="a" d="M351.5 36H369.5"/>
<path class="a" d="M537.5 36H555.5"/>
<rect x="0.5" y="0.5" width="161" height="70" rx="3"/>
<text x="10" y="22" class="t">Records</text>
<text x="10" y="39">2,477, in delivery order</text>
<rect x="186.5" y="0.5" width="161" height="70" rx="3"/>
<text x="196" y="22" class="t"><tspan class="m">DATA</tspan> frames</text>
<text x="196" y="39">65,536 raw bytes at</text>
<text x="196" y="56">most</text>
<rect x="372.5" y="0.5" width="161" height="70" rx="3"/>
<text x="382" y="22" class="t">Checksum, codec</text>
<text x="382" y="39">CRC-32C, then</text>
<text x="382" y="56">Zstandard</text>
<rect x="558.5" y="0.5" width="161" height="70" rx="3"/>
<text x="568" y="22" class="t">Summaries, index</text>
<text x="568" y="39">one entry per frame</text>
<text x="186" y="97" class="q">from <tspan class="m">INDEX</tspan></text>
<text x="321" y="97" class="q">from <tspan class="m">FRAME_SUMMARY</tspan></text>
<path d="M142.5 113.5V108.5H312.5V113.5"/>
<path d="M321.5 113.5V108.5H619.5V113.5"/>
<text x="0" y="124" class="q">Part</text>
<text x="178" y="124" class="q e">Offset</text>
<text x="186" y="124" class="q">Time range, UTC</text>
<text x="321" y="124" class="q">Record types</text>
<text x="566" y="124" class="q">Instrument</text>
<text x="650" y="124" class="q">Query</text>
<rect x="0.5" y="133.5" width="131" height="28" rx="3"/>
<text x="10" y="152" class="t">Header</text>
<text x="178" y="152" class="p e m">0</text>
<text x="186" y="152">container header and <tspan class="m">MANIFEST</tspan>: publishers, record types, <tspan class="m">ordering</tspan></text>
<rect class="n d" x="0.5" y="166.5" width="131" height="28" rx="3"/>
<text x="10" y="185" class="q"><tspan class="m">DATA</tspan> frame 0</text>
<text x="178" y="185" class="p e m">2,120</text>
<text x="186" y="185" class="p m">07:05:06–08:02:38</text>
<text x="321" y="185" class="p"><tspan class="m">INSTRUMENT_DEF</tspan>, <tspan class="m">QUOTE</tspan>, <tspan class="m">TRADE_QUOTE</tspan></text>
<text x="566" y="185" class="p m">11667</text>
<text x="650" y="185" class="q">skipped</text>
