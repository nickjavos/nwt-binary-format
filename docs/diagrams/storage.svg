<text x="10" y="251" class="t"><tspan class="m">DATA</tspan> frame 2</text>
<text x="178" y="251" class="p e m">21,080</text>
<text x="186" y="251" class="p m">08:03:29–08:04:04</text>
<text x="321" y="251" class="p"><tspan class="m">QUOTE</tspan>, <tspan class="m">TRADE_QUOTE</tspan></text>
<text x="566" y="251" class="p m">11667</text>
<circle cx="659" cy="246.5" r="8.5"/>
<text x="659" y="250.5" class="p c">4</text>
<text x="674" y="251" class="p m">114</text>
<rect class="n d" x="0.5" y="265.5" width="131" height="28" rx="3"/>
<text x="10" y="284" class="q"><tspan class="m">DATA</tspan> frame 3</text>
<text x="178" y="284" class="p e m">29,880</text>
<text x="186" y="284" class="p m">08:04:04–08:04:43</text>
<text x="321" y="284" class="p"><tspan class="m">QUOTE</tspan>, <tspan class="m">TRADE_QUOTE</tspan></text>
<text x="566" y="284" class="p m">11667</text>
<text x="650" y="284" class="q">skipped</text>
<rect x="0.5" y="298.5" width="131" height="28" rx="3"/>
<text x="10" y="317" class="t">Summary frame</text>
<text x="178" y="317" class="p e m">37,440</text>
<text x="186" y="317">4 <tspan class="m">FRAME_SUMMARY</tspan> records: types and instruments per frame</text>
<circle cx="659" cy="312.5" r="8.5"/>
<text x="659" y="316.5" class="p c">3</text>
<rect x="0.5" y="331.5" width="131" height="28" rx="3"/>
