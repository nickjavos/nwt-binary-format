<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" class="nwt-dg" font-family="inherit" role="img">
<title>Anatomy of a record</title>
<desc>A record is the common 48-byte header, the fixed fields of its record type, an optional variable part of texts or book levels, and zero padding to a multiple of 8 bytes.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}</style>
<text x="0" y="12"><tspan class="m">record_bytes</tspan>: the whole record, a multiple of 8, at most 1,048,576.</text>
<path d="M0.5 27.5V22.5H719.5V27.5"/>
<rect class="s" x="0.5" y="27.5" width="176" height="53" rx="3"/>
<text x="10" y="49" class="t">Record header</text>
<text x="10" y="66">48 bytes, in every record</text>
<rect x="181.5" y="27.5" width="176" height="53" rx="3"/>
<text x="191" y="49" class="t">Fixed fields</text>
<text x="191" y="66">set by <tspan class="m">record_type</tspan></text>
<rect x="362.5" y="27.5" width="176" height="53" rx="3"/>
<text x="372" y="49" class="t">Variable part</text>
<text x="372" y="66">texts or book levels</text>
<rect class="d" x="543.5" y="27.5" width="176" height="53" rx="3"/>
<text x="553" y="49" class="t">Padding</text>
<text x="553" y="66">zeros, to a multiple of 8</text>
<rect x="0.5" y="97.5" width="347" height="129" rx="3"/>
<text x="10" y="119" class="t">Record header</text>
<text x="338" y="119" class="q e">bytes</text>
<text x="10" y="144" class="p m">record_bytes</text>
<text x="162" y="144" class="q e m">4</text>
<text x="10" y="161" class="p m">record_type</text>
<text x="162" y="161" class="q e m">2</text>
<text x="10" y="178" class="p m">schema_version</text>
<text x="162" y="178" class="q e m">1</text>
<text x="10" y="195" class="p m">flags</text>
<text x="162" y="195" class="q e m">1</text>
<text x="10" y="212" class="p m">publisher_id</text>
<text x="162" y="212" class="q e m">4</text>
<text x="186" y="144" class="p m">channel_id</text>
<text x="338" y="144" class="q e m">4</text>
<text x="186" y="161" class="p m">instrument_id</text>
<text x="338" y="161" class="q e m">8</text>
<text x="186" y="178" class="p m">ts_event</text>
<text x="338" y="178" class="q e m">8</text>
<text x="186" y="195" class="p m">ts_recv</text>
<text x="338" y="195" class="q e m">8</text>
<text x="186" y="212" class="p m">sequence</text>
<text x="338" y="212" class="q e m">8</text>
<text x="372" y="109" class="p"><tspan class="m">TRADE</tspan>: 88 bytes</text>
<rect class="s" x="372.5" y="117.5" width="59" height="25" rx="3"/>
<text x="402" y="134" class="p c">48</text>
<rect x="436.5" y="117.5" width="59" height="25" rx="3"/>
<text x="466" y="134" class="p c">40</text>
<text x="372" y="164" class="p"><tspan class="m">BOOK_SNAPSHOT</tspan>: 56 + 48 × <tspan class="m">levels</tspan> bytes</text>
<rect class="s" x="372.5" y="172.5" width="59" height="25" rx="3"/>
<text x="402" y="189" class="p c">48</text>
<rect x="436.5" y="172.5" width="59" height="25" rx="3"/>
<text x="466" y="189" class="p c">8</text>
<rect x="500.5" y="172.5" width="59" height="25" rx="3"/>
<text x="530" y="189" class="p c">48</text>
<rect x="564.5" y="172.5" width="59" height="25" rx="3"/>
<text x="594" y="189" class="p c">48</text>
<rect x="628.5" y="172.5" width="59" height="25" rx="3"/>
<circle class="k" cx="652" cy="185" r="1.6"/>
<circle class="k" cx="658" cy="185" r="1.6"/>
<circle class="k" cx="664" cy="185" r="1.6"/>
<text x="372" y="219" class="p"><tspan class="m">INSTRUMENT_DEF</tspan>: 112 + text bytes, padded to 8</text>
<rect class="s" x="372.5" y="227.5" width="59" height="25" rx="3"/>
<text x="402" y="244" class="p c">48</text>
<rect x="436.5" y="227.5" width="59" height="25" rx="3"/>
<text x="466" y="244" class="p c">64</text>
<rect x="500.5" y="227.5" width="59" height="25" rx="3"/>
<text x="530" y="244" class="p c">4 texts</text>
<rect class="d" x="564.5" y="227.5" width="59" height="25" rx="3"/>
<text x="372" y="274" class="q">Cells show bytes: header, fixed fields, then levels or texts,</text>
<text x="372" y="291" class="q">then padding.</text>
</svg>
