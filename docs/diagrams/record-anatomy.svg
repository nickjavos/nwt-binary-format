<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" role="img" aria-labelledby="nwtd-record-anatomy-w-title nwtd-record-anatomy-w-desc" class="nwt-diagram" font-family="inherit" fill="none">
<title id="nwtd-record-anatomy-w-title">Anatomy of a record</title>
<desc id="nwtd-record-anatomy-w-desc">A record is the common 48-byte header, the fixed fields of its record type, an optional variable part of texts or book levels, and zero padding to a multiple of 8 bytes.</desc>
<path d="M0.5 116V140" fill="none" stroke="var(--c4, #6b5bb5)" stroke-dasharray="2 3"/>
<path d="M255.5 116V140" fill="none" stroke="var(--c4, #6b5bb5)" stroke-dasharray="2 3"/>
<text x="0" y="14" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">record_bytes</tspan>: the whole record, header and padding included. A multiple of 8, at most 1,048,576.</text>
<path d="M0.5 32.5V26.5H719.5V32.5" fill="none" stroke="var(--fg-3, #6b6a65)"/>
<rect x="0.5" y="32.5" width="255" height="83" rx="3" fill="var(--c4-bg, #ece9f7)" stroke="var(--c4, #6b5bb5)"/>
<text x="12" y="58" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Record header</text>
<text x="12" y="78" font-size="13" fill="var(--fg-2, #63625d)">48 bytes, the same in every record</text>
<rect x="256.5" y="32.5" width="183" height="83" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)"/>
<text x="268" y="58" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Fixed fields</text>
<text x="268" y="78" font-size="13" fill="var(--fg-2, #63625d)">layout set by</text>
<text x="268" y="98" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">record_type</tspan></text>
<rect x="440.5" y="32.5" width="167" height="83" rx="3" fill="var(--c2-bg, #e3f3f1)" stroke="var(--c2, #2a8c82)"/>
<text x="452" y="58" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Variable part</text>
<text x="452" y="78" font-size="13" fill="var(--fg-2, #63625d)">texts or book levels, in</text>
<text x="452" y="98" font-size="13" fill="var(--fg-2, #63625d)">some types</text>
<rect x="608.5" y="32.5" width="111" height="83" rx="3" fill="var(--c5-bg, #eceef1)" stroke="var(--c5, #5f6b7a)"/>
<text x="620" y="58" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Padding</text>
<text x="620" y="78" font-size="13" fill="var(--fg-2, #63625d)">zeros, to a</text>
<text x="620" y="98" font-size="13" fill="var(--fg-2, #63625d)">multiple of 8</text>
<rect x="0.5" y="140.5" width="255" height="257" rx="3" fill="var(--c4-bg, #ece9f7)" stroke="var(--c4, #6b5bb5)"/>
<text x="12" y="166" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Record header</text>
<text x="244" y="166" font-size="13" fill="var(--fg-2, #63625d)" text-anchor="end">bytes</text>
<path d="M12 178.5H244" fill="none" stroke="var(--fg-3, #6b6a65)"/>
<text x="12" y="200" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">record_bytes</tspan></text>
<text x="244" y="200" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">4</tspan></text>
<text x="12" y="220" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">record_type</tspan></text>
<text x="244" y="220" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">2</tspan></text>
<text x="12" y="240" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">schema_version</tspan></text>
<text x="244" y="240" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">1</tspan></text>
<text x="12" y="260" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">flags</tspan></text>
<text x="244" y="260" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">1</tspan></text>
<text x="12" y="280" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">publisher_id</tspan></text>
<text x="244" y="280" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">4</tspan></text>
<text x="12" y="300" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">channel_id</tspan></text>
<text x="244" y="300" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">4</tspan></text>
<text x="12" y="320" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">instrument_id</tspan></text>
<text x="244" y="320" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">8</tspan></text>
<text x="12" y="340" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">ts_event</tspan></text>
<text x="244" y="340" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">8</tspan></text>
<text x="12" y="360" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">ts_recv</tspan></text>
<text x="244" y="360" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">8</tspan></text>
<text x="12" y="380" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">sequence</tspan></text>
<text x="244" y="380" font-size="13" fill="var(--fg-3, #6b6a65)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">8</tspan></text>
<text x="280" y="154" font-size="13" fill="var(--fg, #37352f)" font-weight="600"><tspan font-family="var(--font-mono, ui-monospace, monospace)">TRADE</tspan>: 88 bytes</text>
<rect x="280.5" y="164.5" width="55" height="31" rx="3" fill="var(--c4-bg, #ece9f7)" stroke="var(--c4, #6b5bb5)"/>
<text x="308" y="184.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">48</text>
<rect x="336.5" y="164.5" width="63" height="31" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)"/>
<text x="368" y="184.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">40</text>
<text x="280" y="214" font-size="13" fill="var(--fg-2, #63625d)">The header and 40 bytes of fixed fields.</text>
<text x="280" y="248" font-size="13" fill="var(--fg, #37352f)" font-weight="600"><tspan font-family="var(--font-mono, ui-monospace, monospace)">BOOK_SNAPSHOT</tspan>: 56 + 48 × <tspan font-family="var(--font-mono, ui-monospace, monospace)">levels</tspan> bytes</text>
<rect x="280.5" y="258.5" width="55" height="31" rx="3" fill="var(--c4-bg, #ece9f7)" stroke="var(--c4, #6b5bb5)"/>
<text x="308" y="278.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">48</text>
<rect x="336.5" y="258.5" width="35" height="31" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)"/>
<text x="354" y="278.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">8</text>
<rect x="372.5" y="258.5" width="55" height="31" rx="3" fill="var(--c2-bg, #e3f3f1)" stroke="var(--c2, #2a8c82)"/>
<text x="400" y="278.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">48</text>
<rect x="428.5" y="258.5" width="55" height="31" rx="3" fill="var(--c2-bg, #e3f3f1)" stroke="var(--c2, #2a8c82)"/>
<text x="456" y="278.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">48</text>
<rect x="484.5" y="258.5" width="39" height="31" rx="3" fill="var(--c2-bg, #e3f3f1)" stroke="var(--c2, #2a8c82)"/>
<circle cx="497.0" cy="274.0" r="1.6" fill="var(--fg-3, #6b6a65)"/>
<circle cx="504.0" cy="274.0" r="1.6" fill="var(--fg-3, #6b6a65)"/>
<circle cx="511.0" cy="274.0" r="1.6" fill="var(--fg-3, #6b6a65)"/>
<text x="280" y="308" font-size="13" fill="var(--fg-2, #63625d)">The header, 8 bytes of fixed fields, then one 48-byte level per price</text>
<text x="280" y="328" font-size="13" fill="var(--fg-2, #63625d)">rank: 0 to 1,024 of them.</text>
<text x="280" y="362" font-size="13" fill="var(--fg, #37352f)" font-weight="600"><tspan font-family="var(--font-mono, ui-monospace, monospace)">INSTRUMENT_DEF</tspan>: 112 + text bytes, rounded up to a multiple of 8</text>
<rect x="280.5" y="372.5" width="55" height="31" rx="3" fill="var(--c4-bg, #ece9f7)" stroke="var(--c4, #6b5bb5)"/>
<text x="308" y="392.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">48</text>
<rect x="336.5" y="372.5" width="71" height="31" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)"/>
<text x="372" y="392.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">64</text>
<rect x="408.5" y="372.5" width="111" height="31" rx="3" fill="var(--c2-bg, #e3f3f1)" stroke="var(--c2, #2a8c82)"/>
<text x="464" y="392.68" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle">4 texts</text>
<rect x="520.5" y="372.5" width="27" height="31" rx="3" fill="var(--c5-bg, #eceef1)" stroke="var(--c5, #5f6b7a)"/>
<text x="280" y="422" font-size="13" fill="var(--fg-2, #63625d)">The header, 64 bytes of fixed fields, the texts <tspan font-family="var(--font-mono, ui-monospace, monospace)">symbol</tspan>, <tspan font-family="var(--font-mono, ui-monospace, monospace)">venue</tspan>,</text>
<text x="280" y="442" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">currency</tspan>, <tspan font-family="var(--font-mono, ui-monospace, monospace)">quantity_unit</tspan>, zero padding. The last four fixed fields</text>
<text x="280" y="462" font-size="13" fill="var(--fg-2, #63625d)">hold the text lengths.</text>
</svg>
