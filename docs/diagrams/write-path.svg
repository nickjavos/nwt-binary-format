<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 243" class="nwt-dg" font-family="inherit" role="img">
<title>How a writer builds a file</title>
<desc>A writer opens the container, checks each record, fills a frame, seals it with checksums and optional Zstandard compression, repeats, and closes the container with INDEX and END frames.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-write-path-w)}</style>
<defs><marker id="a-write-path-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M130.5 51H146.5"/>
<path class="a" d="M64.5 149.5V169.5"/>
<path class="a" d="M278.5 51H294.5"/>
<path class="a" d="M426.5 51H442.5"/>
<path class="a" d="M574.5 51H590.5"/>
<path class="a" d="M508.5 149.5V169.5"/>
<path class="a" d="M656.5 149.5V169.5"/>
<path class="h d" d="M132 207H440"/>
<path class="h d" d="M576 207H588"/>
<path class="a" d="M508.5 32.5L508.5 25.5Q508.5 20.5 503.5 20.5L217.5 20.5Q212.5 20.5 212.5 25.5V31.5"/>
<rect x="0.5" y="32.5" width="127" height="36" rx="3"/>
<circle cx="17" cy="50.5" r="8.5"/>
<text x="17" y="54.5" class="p c">1</text>
<text x="32" y="55" class="t">Open</text>
<text x="0" y="89">Write the container</text>
<text x="0" y="106">header and the</text>
<text x="0" y="123">metadata. <tspan class="m">MANIFEST</tspan></text>
<text x="0" y="140">is final.</text>
<rect x="0.5" y="171.5" width="127" height="70" rx="3"/>
<text x="10" y="193" class="t">Header</text>
<text x="10" y="210">and metadata</text>
<rect x="148.5" y="32.5" width="127" height="36" rx="3"/>
<circle cx="165" cy="50.5" r="8.5"/>
<text x="165" y="54.5" class="p c">2</text>
<text x="180" y="55" class="t">Check</text>
<text x="148" y="89">Record type and</text>
<text x="148" y="106">publisher are</text>
<text x="148" y="123">declared; <tspan class="m">sequence</tspan></text>
<text x="148" y="140">is the next number.</text>
<rect x="296.5" y="32.5" width="127" height="36" rx="3"/>
<circle cx="313" cy="50.5" r="8.5"/>
<text x="313" y="54.5" class="p c">3</text>
<text x="328" y="55" class="t">Fill</text>
<text x="296" y="89">Add whole records,</text>
<text x="296" y="106">in source order, until</text>
<text x="296" y="123">the frame is full.</text>
<rect x="444.5" y="32.5" width="127" height="36" rx="3"/>
<circle cx="461" cy="50.5" r="8.5"/>
<text x="461" y="54.5" class="p c">4</text>
<text x="476" y="55" class="t">Seal</text>
<text x="444" y="89">CRC-32C of the raw</text>
<text x="444" y="106">payload, optional</text>
<text x="444" y="123">Zstandard, frame</text>
<text x="444" y="140">header.</text>
<rect x="444.5" y="171.5" width="127" height="70" rx="3"/>
<text x="454" y="193" class="t"><tspan class="m">DATA</tspan> frame</text>
<text x="454" y="210">one per sealed</text>
<text x="454" y="227">frame</text>
<rect x="592.5" y="32.5" width="127" height="36" rx="3"/>
<circle cx="609" cy="50.5" r="8.5"/>
<text x="609" y="54.5" class="p c">5</text>
<text x="624" y="55" class="t">Close</text>
<text x="592" y="89">At the end of the</text>
<text x="592" y="106">source: optional</text>
<text x="592" y="123"><tspan class="m">INDEX</tspan> frames, then</text>
<text x="592" y="140"><tspan class="m">END</tspan>.</text>
<rect x="592.5" y="171.5" width="127" height="70" rx="3"/>
<text x="602" y="193" class="t"><tspan class="m">INDEX</tspan> frames</text>
<text x="602" y="210">then the <tspan class="m">END</tspan></text>
<text x="602" y="227">frame</text>
<text x="360" y="13" class="c">more records</text>
</svg>
