<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" class="nwt-dg" font-family="inherit" role="img">
<title>States of an order-level book</title>
<desc>An order-level book is Unknown, Snapshot open or Valid; MBO actions CLEAR, SNAPSHOT_BEGIN, ADD, MODIFY, DELETE and SNAPSHOT_END move it, and a GAP returns it to Unknown.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-order-book-state-w)}</style>
<defs><marker id="a-order-book-state-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M24.5 19.5V39.5"/>
<path class="a d" d="M100.5 10.5V39.5"/>
<path class="a" d="M160.5 84.5H279.5"/>
<path class="a" d="M440.5 72.5H559.5"/>
<path class="a" d="M560.5 96.5H441.5"/>
<path class="a" d="M80.5 128.5L80.5 145.5Q80.5 150.5 85.5 150.5L635.5 150.5Q640.5 150.5 640.5 145.5V129.5"/>
<path class="a" d="M340.5 40.5L340.5 29.5Q340.5 24.5 345.5 24.5L375.5 24.5Q380.5 24.5 380.5 29.5V39.5"/>
<path class="a" d="M620.5 40.5L620.5 29.5Q620.5 24.5 625.5 24.5L655.5 24.5Q660.5 24.5 660.5 29.5V39.5"/>
<rect class="n d" x="0.5" y="40.5" width="159" height="87" rx="3"/>
<text x="10" y="62" class="t">Unknown</text>
<text x="10" y="79">the live orders are not</text>
<text x="10" y="96">known</text>
<rect class="d" x="280.5" y="40.5" width="159" height="87" rx="3"/>
<text x="290" y="62" class="t">Snapshot open</text>
<text x="290" y="79">a private working book</text>
<text x="290" y="96">is being filled</text>
<rect class="f" x="560.5" y="40.5" width="159" height="87" rx="3"/>
<text x="570" y="62" class="t">Valid</text>
<text x="570" y="79">the committed book</text>
<text x="570" y="96">equals the book of the</text>
<text x="570" y="113">source</text>
<circle class="k" cx="24.5" cy="14.5" r="4"/>
<text x="108" y="16"><tspan class="m">GAP</tspan>, from any state</text>
<text x="220" y="77" class="p c m">SNAPSHOT_BEGIN</text>
<text x="500" y="65" class="p c m">SNAPSHOT_END</text>
<text x="500" y="112" class="p c m">SNAPSHOT_BEGIN</text>
<text x="360" y="144" class="p c m">CLEAR</text>
<text x="360" y="18" class="p c m">ADD</text>
<text x="720" y="18" class="p e"><tspan class="m">ADD</tspan>, <tspan class="m">MODIFY</tspan>, <tspan class="m">DELETE</tspan>, <tspan class="m">CLEAR</tspan></text>
<text x="0" y="174" class="q">A <tspan class="m">GAP</tspan> on the channel returns the book to Unknown from any state. The committed book and the working book are</text>
<text x="0" y="191" class="q">discarded.</text>
</svg>
