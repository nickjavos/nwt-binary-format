<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="nwtd-order-book-state-w-title nwtd-order-book-state-w-desc" class="nwt-diagram" font-family="inherit" fill="none">
<title id="nwtd-order-book-state-w-title">States of an order-level book</title>
<desc id="nwtd-order-book-state-w-desc">An order-level book is Unknown, Snapshot open or Valid; MBO actions CLEAR, SNAPSHOT_BEGIN, ADD, MODIFY, DELETE and SNAPSHOT_END move it, and a GAP returns it to Unknown.</desc>
<defs>
<marker id="nwtd-order-book-state-w-a-c3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7z" fill="var(--c3, #b7791f)"/></marker>
<marker id="nwtd-order-book-state-w-a-fg3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7z" fill="var(--fg-3, #6b6a65)"/></marker>
</defs>
<path d="M60.5 136.5 L60.5 166.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M216.5 196.5 L274.5 196.5 Q280.5 196.5 280.5 190.5 L280.5 104.5 Q280.5 98.5 286.5 98.5 L440.5 98.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M216.5 220.5 L274.5 220.5 Q280.5 220.5 280.5 226.5 L280.5 312.5 Q280.5 318.5 286.5 318.5 L440.5 318.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M512.5 140.5 L512.5 276.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M584.5 276.5 L584.5 140.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M536.5 56.5 L536.5 38.5 Q536.5 32.5 542.5 32.5 L578.5 32.5 Q584.5 32.5 584.5 38.5 L584.5 56.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M536.5 360.5 L536.5 378.5 Q536.5 384.5 542.5 384.5 L578.5 384.5 Q584.5 384.5 584.5 378.5 L584.5 360.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-order-book-state-w-a-fg3)"/>
<path d="M60.5 294.5 L60.5 250.5" fill="none" stroke="var(--c3, #b7791f)" stroke-dasharray="4 3" marker-end="url(#nwtd-order-book-state-w-a-c3)"/>
<rect x="0.5" y="166.5" width="215" height="83" rx="3" fill="none" stroke="var(--fg-3, #6b6a65)" stroke-opacity="0.7" stroke-dasharray="4 3"/>
<text x="12" y="192" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Unknown</text>
<text x="12" y="212" font-size="13" fill="var(--fg-2, #63625d)">The live orders are not known</text>
<rect x="440.5" y="56.5" width="215" height="83" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)" stroke-dasharray="4 3"/>
<text x="452" y="82" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Snapshot open</text>
<text x="452" y="102" font-size="13" fill="var(--fg-2, #63625d)">A private working book is</text>
<text x="452" y="122" font-size="13" fill="var(--fg-2, #63625d)">being filled</text>
<rect x="440.5" y="276.5" width="215" height="83" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)"/>
<text x="452" y="302" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Valid</text>
<text x="452" y="322" font-size="13" fill="var(--fg-2, #63625d)">The committed book equals</text>
<text x="452" y="342" font-size="13" fill="var(--fg-2, #63625d)">the book of the source</text>
<circle cx="60.5" cy="130.5" r="5" fill="var(--fg-3, #6b6a65)"/>
<text x="360" y="90" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle"><tspan font-family="var(--font-mono, ui-monospace, monospace)">SNAPSHOT_BEGIN</tspan></text>
<text x="360" y="310" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle"><tspan font-family="var(--font-mono, ui-monospace, monospace)">CLEAR</tspan></text>
<text x="504" y="213" font-size="13" fill="var(--fg, #37352f)" text-anchor="end"><tspan font-family="var(--font-mono, ui-monospace, monospace)">SNAPSHOT_END</tspan></text>
<text x="592" y="213" font-size="13" fill="var(--fg, #37352f)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">SNAPSHOT_BEGIN</tspan></text>
<text x="560" y="24" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle"><tspan font-family="var(--font-mono, ui-monospace, monospace)">ADD</tspan></text>
<text x="560" y="404" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle"><tspan font-family="var(--font-mono, ui-monospace, monospace)">ADD</tspan>, <tspan font-family="var(--font-mono, ui-monospace, monospace)">MODIFY</tspan>, <tspan font-family="var(--font-mono, ui-monospace, monospace)">DELETE</tspan>, <tspan font-family="var(--font-mono, ui-monospace, monospace)">CLEAR</tspan></text>
<text x="0" y="314" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">GAP</tspan> on the channel: from any state back</text>
<text x="0" y="334" font-size="13" fill="var(--fg-2, #63625d)">to Unknown. The committed book and</text>
<text x="0" y="354" font-size="13" fill="var(--fg-2, #63625d)">the working book are discarded.</text>
</svg>
