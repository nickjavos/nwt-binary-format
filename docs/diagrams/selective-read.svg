<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" class="nwt-dg" font-family="inherit" role="img">
<title>Reading only the frames a query needs</title>
<desc>In a store file a reader goes from the END frame to the INDEX frames and the summary frames, and then reads only the DATA frames that can hold a match.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-selective-read-w)}</style>
<defs><marker id="a-selective-read-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M40.5 276L31.5 276Q26.5 276 26.5 271L26.5 251.5Q26.5 246.5 31.5 246.5H39.5"/>
<path class="a" d="M40.5 231.5L17.5 231.5Q12.5 231.5 12.5 226.5L12.5 133Q12.5 128 17.5 128H29.5"/>
<rect x="40.5" y="0.5" width="249" height="32" rx="3"/>
<text x="50" y="21" class="t">Container header, metadata</text>
<rect class="n d" x="40.5" y="37.5" width="249" height="32" rx="3"/>
<text x="50" y="58" class="q"><tspan class="m">DATA</tspan> frame 0</text>
<rect x="40.5" y="74.5" width="249" height="32" rx="3"/>
<text x="50" y="95" class="t"><tspan class="m">DATA</tspan> frame 1</text>
<circle cx="306" cy="90.5" r="8.5"/>
<text x="306" y="94.5" class="p c">5</text>
<rect class="n d" x="40.5" y="111.5" width="249" height="32" rx="3"/>
<text x="50" y="132" class="q"><tspan class="m">DATA</tspan> frame 2</text>
<rect x="40.5" y="148.5" width="249" height="32" rx="3"/>
<text x="50" y="169" class="t"><tspan class="m">DATA</tspan> frame 3</text>
<circle cx="306" cy="164.5" r="8.5"/>
<text x="306" y="168.5" class="p c">5</text>
<rect x="40.5" y="185.5" width="249" height="32" rx="3"/>
<text x="50" y="206" class="t">Summary frames</text>
<circle cx="306" cy="201.5" r="8.5"/>
<text x="306" y="205.5" class="p c">3</text>
<rect x="40.5" y="222.5" width="249" height="32" rx="3"/>
<text x="50" y="243" class="t"><tspan class="m">INDEX</tspan> frames</text>
<circle cx="306" cy="238.5" r="8.5"/>
<text x="306" y="242.5" class="p c">2</text>
<rect x="40.5" y="259.5" width="249" height="32" rx="3"/>
<text x="50" y="280" class="t"><tspan class="m">END</tspan> frame</text>
<circle cx="306" cy="275.5" r="8.5"/>
<text x="306" y="279.5" class="p c">1</text>
<path d="M36 37.5H30.5V217.5H36"/>
<circle cx="343" cy="10.5" r="8.5"/>
<text x="343" y="14.5" class="p c">1</text>
<text x="360" y="14" class="p">Read the last 96 bytes, the <tspan class="m">END</tspan> frame: it gives the offset of</text>
<text x="360" y="31" class="p">the first <tspan class="m">INDEX</tspan> frame.</text>
<circle cx="343" cy="52.5" r="8.5"/>
<text x="343" y="56.5" class="p c">2</text>
<text x="360" y="56" class="p">Read the <tspan class="m">INDEX</tspan> frames: the offset and the time range of</text>
<text x="360" y="73" class="p">every <tspan class="m">DATA</tspan> frame.</text>
<circle cx="343" cy="94.5" r="8.5"/>
<text x="343" y="98.5" class="p c">3</text>
<text x="360" y="98" class="p">Read the summary frames: the record types and the</text>
<text x="360" y="115" class="p">instrument range of every frame.</text>
<circle cx="343" cy="136.5" r="8.5"/>
<text x="343" y="140.5" class="p c">4</text>
<text x="360" y="140" class="p">Keep the frames whose time range, <tspan class="m">type_mask</tspan> and</text>
<text x="360" y="157" class="p">instrument range can match the query.</text>
<circle cx="343" cy="178.5" r="8.5"/>
<text x="343" y="182.5" class="p c">5</text>
<text x="360" y="182" class="p">Read the kept frames in file order and filter their records.</text>
<rect x="0.5" y="304.5" width="15" height="11" rx="3"/>
<text x="22" y="314.5">read</text>
<rect class="n d" x="68.8" y="304.5" width="15" height="11" rx="3"/>
<text x="90.3" y="314.5">skipped</text>
</svg>
