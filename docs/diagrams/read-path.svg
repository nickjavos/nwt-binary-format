<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 375" class="nwt-dg" font-family="inherit" role="img">
<title>How a reader reads a whole file</title>
<desc>A reader checks the container header and the metadata, then for every frame checks the header and the payload and handles it by kind: DATA delivers records, INDEX is compared with the frames read, END closes the file.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-read-path-w)}</style>
<defs><marker id="a-read-path-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M122.5 192H130.5"/>
<path class="a" d="M254.5 192H262.5"/>
<path class="a" d="M386.5 192H394.5"/>
<path class="a" d="M518.5 192H534.5"/>
<path class="a" d="M558.5 170L558.5 80Q558.5 75 563.5 75H598.5"/>
<path class="a" d="M580.5 192H598.5"/>
<path class="a" d="M558.5 214L558.5 304Q558.5 309 563.5 309H598.5"/>
<path class="a" d="M660.5 22.5L660.5 15.5Q660.5 10.5 655.5 10.5L329.5 10.5Q324.5 10.5 324.5 15.5V137.5"/>
<path class="a" d="M660.5 361.5L660.5 368.5Q660.5 373.5 655.5 373.5L329.5 373.5Q324.5 373.5 324.5 368.5V246.5"/>
<rect x="0.5" y="139.5" width="119" height="104" rx="3"/>
<text x="10" y="161" class="t">Container</text>
<text x="10" y="178" class="t">header</text>
<text x="10" y="195">magic, version,</text>
<text x="10" y="212">header</text>
<text x="10" y="229">CRC-32C</text>
<rect x="132.5" y="139.5" width="119" height="104" rx="3"/>
<text x="142" y="161" class="t">Metadata</text>
<text x="142" y="178">CRC-32C, then</text>
<text x="142" y="195">the <tspan class="m">MANIFEST</tspan></text>
<rect x="264.5" y="139.5" width="119" height="104" rx="3"/>
<text x="274" y="161" class="t">Frame header</text>
<text x="274" y="178">CRC-32C;</text>
<text x="274" y="195" class="m">frame_seq</text>
<text x="274" y="212">counts up by 1</text>
<rect x="396.5" y="139.5" width="119" height="104" rx="3"/>
<text x="406" y="161" class="t">Payload</text>
<text x="406" y="178">Zstandard if</text>
<text x="406" y="195"><tspan class="m">codec</tspan> is 1;</text>
<text x="406" y="212">CRC-32C of the</text>
<text x="406" y="229">raw bytes</text>
<polygon points="558,170 580,192 558,214 536,192"/>
<text x="558" y="196" class="p c m">kind</text>
<rect x="600.5" y="22.5" width="119" height="104" rx="3"/>
<text x="610" y="44" class="t"><tspan class="m">DATA</tspan>: records</text>
<text x="610" y="61">split, check each</text>
<text x="610" y="78"><tspan class="m">sequence</tspan>,</text>
<text x="610" y="95">deliver in order</text>
<rect x="600.5" y="139.5" width="119" height="104" rx="3"/>
<text x="610" y="161" class="t"><tspan class="m">END</tspan>: end</text>
<text x="610" y="178">totals match; no</text>
<text x="610" y="195">byte follows</text>
<rect x="600.5" y="256.5" width="119" height="104" rx="3"/>
<text x="610" y="278" class="t"><tspan class="m">INDEX</tspan>: index</text>
<text x="610" y="295">entries equal the</text>
<text x="610" y="312">frames read</text>
<text x="462" y="26" class="c">next frame</text>
<text x="462" y="367" class="c">next frame</text>
</svg>
