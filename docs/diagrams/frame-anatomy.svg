<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" class="nwt-dg" font-family="inherit" role="img">
<title>Anatomy of a frame</title>
<desc>A frame is a 64-byte header, a payload stored raw or as one Zstandard frame, and zero padding; one CRC-32C covers the header and another covers the raw payload.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-frame-anatomy-w)}</style>
<defs><marker id="a-frame-anatomy-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M386.5 54.5V125.5"/>
<rect class="s" x="0.5" y="0.5" width="236.3" height="53" rx="3"/>
<text x="10" y="22" class="t">Frame header</text>
<text x="10" y="39">64 bytes</text>
<rect x="241.8" y="0.5" width="236.3" height="53" rx="3"/>
<text x="251.3" y="22" class="t">Payload</text>
<text x="251.3" y="39"><tspan class="m">stored_bytes</tspan> bytes, as stored</text>
<rect class="d" x="483.2" y="0.5" width="236.3" height="53" rx="3"/>
<text x="492.7" y="22" class="t">Padding</text>
<text x="492.7" y="39">0 to 7 zero bytes</text>
<rect x="0.5" y="70.5" width="347" height="186" rx="3"/>
<text x="10" y="92" class="t">Frame header</text>
<text x="338" y="92" class="q e">bytes</text>
<text x="10" y="117" class="p m">magic</text>
<text x="162" y="117" class="q e m">4</text>
<text x="10" y="134" class="p m">kind</text>
<text x="162" y="134" class="q e m">1</text>
<text x="10" y="151" class="p m">codec</text>
<text x="162" y="151" class="q e m">1</text>
<text x="10" y="168" class="p m">stored_bytes</text>
<text x="162" y="168" class="q e m">4</text>
<text x="10" y="185" class="p m">raw_bytes</text>
<text x="162" y="185" class="q e m">4</text>
<text x="10" y="202" class="p m">record_count</text>
<text x="162" y="202" class="q e m">4</text>
<text x="186" y="117" class="p m">frame_seq</text>
<text x="338" y="117" class="q e m">8</text>
<text x="186" y="134" class="p m">min_event_ns</text>
<text x="338" y="134" class="q e m">8</text>
<text x="186" y="151" class="p m">max_event_ns</text>
<text x="338" y="151" class="q e m">8</text>
<text x="186" y="168" class="p m">payload_crc32c</text>
<text x="338" y="168" class="q e m">4</text>
<text x="186" y="185" class="p m">header_crc32c</text>
<text x="338" y="185" class="q e m">4</text>
<text x="186" y="202" class="p">other fields</text>
<text x="338" y="202" class="q e m">14</text>
<text x="10" y="225"><tspan class="m">kind</tspan>: 1 <tspan class="m">DATA</tspan>, 2 <tspan class="m">INDEX</tspan>, 3 <tspan class="m">END</tspan>. <tspan class="m">codec</tspan>: 0 raw, 1</text>
<text x="10" y="242">Zstandard.</text>
<path d="M0.5 262.5V267.5H347.5V262.5"/>
<text x="0" y="285"><tspan class="m">header_crc32c</tspan> covers these 64 bytes.</text>
<text x="398" y="76"><tspan class="m">codec</tspan> 0: stored as it is.</text>
<text x="398" y="93"><tspan class="m">codec</tspan> 1: one Zstandard frame, <tspan class="m">raw_bytes</tspan> bytes after</text>
<text x="398" y="110">decompression.</text>
<rect x="372.5" y="125.5" width="83" height="25" rx="3"/>
<text x="414" y="142" class="p c">record</text>
<rect x="460.5" y="125.5" width="83" height="25" rx="3"/>
<text x="502" y="142" class="p c">record</text>
<rect x="548.5" y="125.5" width="83" height="25" rx="3"/>
<text x="590" y="142" class="p c">record</text>
<rect x="636.5" y="125.5" width="83" height="25" rx="3"/>
<circle class="k" cx="672" cy="138" r="1.6"/>
<circle class="k" cx="678" cy="138" r="1.6"/>
<circle class="k" cx="684" cy="138" r="1.6"/>
<path d="M372.5 156.5V161.5H719.5V156.5"/>
<text x="372" y="179">Raw payload: <tspan class="m">raw_bytes</tspan> bytes, <tspan class="m">record_count</tspan> whole</text>
<text x="372" y="196">records.</text>
<text x="372" y="213"><tspan class="m">payload_crc32c</tspan> covers exactly these bytes.</text>
</svg>
