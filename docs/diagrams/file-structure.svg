<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" class="nwt-dg" font-family="inherit" role="img">
<title>Structure of an NWT file</title>
<desc>An NWT file from the first byte to the last: a 64-byte container header, the metadata, DATA frames, optional INDEX frames and a 96-byte END frame.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}</style>
<path d="M0.5 37V42"/>
<path d="M113.2 37V42"/>
<path d="M225.8 37V42"/>
<rect x="0.5" y="0.5" width="107.7" height="36" rx="3"/>
<text x="54.3" y="23" class="t c">Header</text>
<text x="0" y="55" class="q m">0</text>
<rect x="113.2" y="0.5" width="107.7" height="36" rx="3"/>
<text x="167" y="23" class="t c">Metadata</text>
<text x="112.7" y="55" class="q m">64</text>
<rect x="225.8" y="0.5" width="107.7" height="36" rx="3"/>
<text x="279.7" y="23" class="t c"><tspan class="m">DATA</tspan> 0</text>
<text x="225.3" y="55" class="q m">64 + metadata_bytes</text>
<rect x="338.5" y="0.5" width="107.7" height="36" rx="3"/>
<text x="392.3" y="23" class="t c"><tspan class="m">DATA</tspan> 1</text>
<circle class="k" cx="466.7" cy="18.5" r="1.6"/>
<circle class="k" cx="472.7" cy="18.5" r="1.6"/>
<circle class="k" cx="478.7" cy="18.5" r="1.6"/>
<rect class="d" x="499.2" y="0.5" width="107.7" height="36" rx="3"/>
<text x="553" y="23" class="t c m">INDEX</text>
<rect x="611.8" y="0.5" width="107.7" height="36" rx="3"/>
<text x="665.7" y="23" class="t c m">END</text>
<text x="720" y="55" class="q e">last 96 bytes</text>
<text x="0" y="85" class="t">Container header</text>
<text x="0" y="102" class="q">64 bytes</text>
<text x="0" y="119">magic, version, <tspan class="m">stream_id</tspan>, CRC-32C</text>
<text x="0" y="136">of the header and of the metadata</text>
<text x="245.3" y="85" class="t">Metadata</text>
<text x="245.3" y="102" class="q">8 to 1,048,576 bytes</text>
<text x="245.3" y="119"><tspan class="m">MANIFEST</tspan>: publishers and record</text>
<text x="245.3" y="136">types; optional <tspan class="m">PROVENANCE</tspan></text>
<text x="490.7" y="85" class="t"><tspan class="m">DATA</tspan> frames</text>
<text x="490.7" y="102" class="q">64 + payload, padded to 8</text>
<text x="490.7" y="119">a 64-byte frame header, then whole</text>
<text x="490.7" y="136">records, raw or Zstandard</text>
<text x="0" y="165" class="t"><tspan class="m">INDEX</tspan> frames</text>
<text x="0" y="182" class="q">optional</text>
<text x="0" y="199">one 40-byte entry per <tspan class="m">DATA</tspan> frame:</text>
<text x="0" y="216">offset, time range, size, count</text>
<text x="245.3" y="165" class="t"><tspan class="m">END</tspan> frame</text>
<text x="245.3" y="182" class="q">96 bytes</text>
<text x="245.3" y="199">totals, completion status, offset of the</text>
<text x="245.3" y="216">first <tspan class="m">INDEX</tspan> frame</text>
</svg>
