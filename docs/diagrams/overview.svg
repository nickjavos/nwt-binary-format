<text x="10" y="22" class="t">Source files</text>
<text x="10" y="39">CSV, reference files</text>
<rect x="186.5" y="0.5" width="161" height="53" rx="3"/>
<text x="196" y="22" class="t">Convert and write</text>
<text x="196" y="39" class="m">nwt convert</text>
<rect class="f" x="372.5" y="0.5" width="161" height="53" rx="3"/>
