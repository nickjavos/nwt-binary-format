<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" class="nwt-dg" font-family="inherit" role="img">
<title>State after a GAP record</title>
<desc>A GAP record makes the top of book, the best quote, the order-level book, the aggregate book and the trading status of its channel unknown; each becomes valid again when its own restoring record arrives.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}.nwt-dg .a{marker-end:url(#a-recovery-w)}</style>
<defs><marker id="a-recovery-w" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="k" d="M.5 .5L6.5 3.5L.5 6.5z"/></marker></defs>
<path class="a" d="M310 8.5H342"/>
<path d="M391.8 64V69"/>
<path d="M442.4 112V117"/>
<path d="M501.5 160V165"/>
<path d="M417.1 208V213"/>
<path d="M619.7 208V213"/>
<path d="M560.6 256V261"/>
<text x="176" y="12" class="q">Records in byte order</text>
<text x="298" y="33" class="p"><tspan class="m">GAP</tspan> record for this publisher and channel</text>
<text x="0" y="59.5" class="t">Top of book</text>
<rect class="s" x="176.5" y="46.5" width="113" height="17" rx="3"/>
<rect class="n d" x="290.5" y="46.5" width="100.3" height="17" rx="3"/>
<rect class="s" x="391.8" y="46.5" width="327.7" height="17" rx="3"/>
<text x="391.3" y="81" class="p c m">QUOTE</text>
<text x="0" y="107.5" class="t">Best quote</text>
<rect class="s" x="176.5" y="94.5" width="113" height="17" rx="3"/>
<rect class="n d" x="290.5" y="94.5" width="150.9" height="17" rx="3"/>
<rect class="s" x="442.4" y="94.5" width="277.1" height="17" rx="3"/>
<text x="441.9" y="129" class="p c m">BEST_QUOTE</text>
<text x="0" y="155.5" class="t">Aggregate book</text>
<rect class="s" x="176.5" y="142.5" width="113" height="17" rx="3"/>
<rect class="n d" x="290.5" y="142.5" width="210" height="17" rx="3"/>
<rect class="s" x="501.5" y="142.5" width="218" height="17" rx="3"/>
<text x="501" y="177" class="p c m">BOOK_SNAPSHOT</text>
<text x="0" y="203.5" class="t">Order-level book</text>
<rect class="s" x="176.5" y="190.5" width="113" height="17" rx="3"/>
<rect class="n d" x="290.5" y="190.5" width="125.6" height="17" rx="3"/>
<rect class="s d" x="417.1" y="190.5" width="201.6" height="17" rx="3"/>
<rect class="s" x="619.7" y="190.5" width="99.8" height="17" rx="3"/>
<text x="416.6" y="225" class="p c m">SNAPSHOT_BEGIN</text>
<text x="619.2" y="225" class="p c m">SNAPSHOT_END</text>
<text x="0" y="251.5" class="t">Trading status</text>
<rect class="s" x="176.5" y="238.5" width="113" height="17" rx="3"/>
<rect class="n d" x="290.5" y="238.5" width="269.1" height="17" rx="3"/>
<rect class="s" x="560.6" y="238.5" width="158.9" height="17" rx="3"/>
<text x="560.1" y="273" class="p c m">STATUS</text>
<path class="f" d="M290.5 23V278"/>
<rect class="s" x="0.5" y="286.5" width="15" height="11" rx="3"/>
<text x="22" y="296.5">valid</text>
<rect class="n d" x="69.7" y="286.5" width="15" height="11" rx="3"/>
<text x="91.2" y="296.5">unknown</text>
<rect class="s d" x="164.6" y="286.5" width="15" height="11" rx="3"/>
<text x="186.1" y="296.5">snapshot open, private until <tspan class="m">SNAPSHOT_END</tspan></text>
<text x="0" y="320" class="q">A <tspan class="m">GAP</tspan> does not touch definitions, reference data, statistics and trade lifecycles. Trades and bars of the lost interval stay</text>
<text x="0" y="337" class="q">possibly incomplete.</text>
</svg>
