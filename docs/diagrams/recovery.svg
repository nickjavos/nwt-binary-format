<text x="192" y="14" font-size="13" fill="var(--fg-3, #6b6a65)">Records in byte order</text>
<text x="320" y="44" font-size="13" fill="var(--fg, #37352f)" font-weight="600"><tspan font-family="var(--font-mono, ui-monospace, monospace)">GAP</tspan> record for this publisher and channel</text>
<text x="0" y="76" font-size="14" fill="var(--fg, #37352f)" font-weight="600">Top of book</text>
