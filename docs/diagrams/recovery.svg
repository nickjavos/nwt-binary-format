<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" role="img" aria-labelledby="nwtd-recovery-w-title nwtd-recovery-w-desc" class="nwt-diagram" font-family="inherit" fill="none">
<title id="nwtd-recovery-w-title">State after a GAP record</title>
<desc id="nwtd-recovery-w-desc">A GAP record makes the top of book, the best quote, the order-level book, the aggregate book and the trading status of its channel unknown; each becomes valid again when its own restoring record arrives.</desc>
<defs>
<marker id="nwtd-recovery-w-a-fg3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7z" fill="var(--fg-3, #6b6a65)"/></marker>
</defs>
<path d="M338.48 10.5 L374.48 10.5" fill="none" stroke="var(--fg-3, #6b6a65)" marker-end="url(#nwtd-recovery-w-a-fg3)"/>
