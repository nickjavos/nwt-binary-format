<path d="M568.5 314V320" fill="none" stroke="var(--fg-3, #6b6a65)"/>
<text x="568" y="334" font-size="13" fill="var(--fg, #37352f)" text-anchor="middle"><tspan font-family="var(--font-mono, ui-monospace, monospace)">STATUS</tspan></text>
<path d="M312.5 32V342" fill="none" stroke="var(--c3, #b7791f)" stroke-width="1.5"/>
<rect x="0.5" y="362.5" width="19" height="13" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)"/>
<text x="28" y="374" font-size="13" fill="var(--fg-2, #63625d)">valid</text>
<rect x="81.93" y="362.5" width="19" height="13" rx="3" fill="none" stroke="var(--fg-3, #6b6a65)" stroke-opacity="0.7" stroke-dasharray="4 3"/>
<text x="109.43" y="374" font-size="13" fill="var(--fg-2, #63625d)">unknown</text>
<rect x="191.32" y="362.5" width="19" height="13" rx="3" fill="var(--c1-bg, #e8f0fb)" stroke="var(--c1, #1b6ac9)" stroke-dasharray="4 3"/>
<text x="218.82" y="374" font-size="13" fill="var(--fg-2, #63625d)">snapshot open: private until <tspan font-family="var(--font-mono, ui-monospace, monospace)">SNAPSHOT_END</tspan></text>
<text x="0" y="402" font-size="13" fill="var(--fg-2, #63625d)">A <tspan font-family="var(--font-mono, ui-monospace, monospace)">GAP</tspan> does not touch definitions, reference data, statistics and trade lifecycles. Trades and bars of the lost interval</text>
<text x="0" y="422" font-size="13" fill="var(--fg-2, #63625d)">stay possibly incomplete.</text>
