<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 359" class="nwt-dg" font-family="inherit" role="img">
<title>The manifest and the three groups of record types</title>
<desc>The manifest declares publishers and record types; instrument and venue records define instruments; market records refer to an instrument definition; stream records describe the stream itself.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}</style>
<rect x="0.5" y="0.5" width="719" height="70" rx="3"/>
<text x="10" y="22" class="t m">MANIFEST</text>
<text x="10" y="39">Declared once, before the first record: every publisher (<tspan class="m">publisher_id</tspan>) and every record type (<tspan class="m">record_type</tspan>) of the</text>
<text x="10" y="56">file.</text>
<text x="0" y="97" class="t">Instruments and venues</text>
<text x="0" y="114"><tspan class="m">INSTRUMENT_DEF</tspan> and six reference records.</text>
<text x="0" y="131">Key: <tspan class="m">publisher_id</tspan> + <tspan class="m">instrument_id</tspan>.</text>
<rect class="f" x="0.5" y="144.5" width="135" height="25" rx="3"/>
<text x="68" y="161" class="p c m">INSTRUMENT_DEF</text>
<rect x="146.5" y="144.5" width="135" height="25" rx="3"/>
<text x="214" y="161" class="p c m">OPTION_DEF</text>
<rect x="0.5" y="176.5" width="135" height="25" rx="3"/>
<text x="68" y="193" class="p c m">LISTING</text>
<rect x="146.5" y="176.5" width="135" height="25" rx="3"/>
<text x="214" y="193" class="p c m">SYMBOL_MAP</text>
<rect x="0.5" y="208.5" width="135" height="25" rx="3"/>
<text x="68" y="225" class="p c m">SECURITY_DEF</text>
<rect x="146.5" y="208.5" width="135" height="25" rx="3"/>
<text x="214" y="225" class="p c m">CORPORATE_ACTION</text>
<rect x="0.5" y="240.5" width="135" height="25" rx="3"/>
<text x="68" y="257" class="p c m">VENUE_DEF</text>
<text x="292" y="97" class="t">Market records</text>
<text x="292" y="114">Each needs an <tspan class="m">INSTRUMENT_DEF</tspan> with the same</text>
<text x="292" y="131">key earlier in the file.</text>
<rect x="292.5" y="144.5" width="135" height="25" rx="3"/>
<text x="360" y="161" class="p c m">TRADE</text>
<rect x="438.5" y="144.5" width="135" height="25" rx="3"/>
<text x="506" y="161" class="p c m">TRADE_QUOTE</text>
<rect x="292.5" y="176.5" width="135" height="25" rx="3"/>
<text x="360" y="193" class="p c m">QUOTE</text>
<rect x="438.5" y="176.5" width="135" height="25" rx="3"/>
<text x="506" y="193" class="p c m">BEST_QUOTE</text>
<rect x="292.5" y="208.5" width="135" height="25" rx="3"/>
<text x="360" y="225" class="p c m">MBO</text>
<rect x="438.5" y="208.5" width="135" height="25" rx="3"/>
<text x="506" y="225" class="p c m">BOOK_SNAPSHOT</text>
<rect x="292.5" y="240.5" width="135" height="25" rx="3"/>
<text x="360" y="257" class="p c m">BOOK_DELTA</text>
<rect x="438.5" y="240.5" width="135" height="25" rx="3"/>
<text x="506" y="257" class="p c m">BAR</text>
<rect x="292.5" y="272.5" width="135" height="25" rx="3"/>
<text x="360" y="289" class="p c m">STATISTICS</text>
<rect x="438.5" y="272.5" width="135" height="25" rx="3"/>
<text x="506" y="289" class="p c m">OPTION_ANALYTICS</text>
<rect x="292.5" y="304.5" width="135" height="25" rx="3"/>
<text x="360" y="321" class="p c m">IMBALANCE</text>
<rect x="438.5" y="304.5" width="135" height="25" rx="3"/>
<text x="506" y="321" class="p c m">STATUS</text>
<text x="584" y="97" class="t">Stream records</text>
<text x="584" y="114">About the stream:</text>
<text x="584" y="131"><tspan class="m">instrument_id</tspan> is 0.</text>
<rect x="584.5" y="144.5" width="135" height="25" rx="3"/>
<text x="652" y="161" class="p c m">GAP</text>
<rect x="584.5" y="176.5" width="135" height="25" rx="3"/>
<text x="652" y="193" class="p c m">SYSTEM</text>
<rect x="584.5" y="208.5" width="135" height="25" rx="3"/>
<text x="652" y="225" class="p c m">FRAME_SUMMARY</text>
<text x="0" y="354" class="q">A <tspan class="m">GAP</tspan> invalidates the books, quotes and trading status of its <tspan class="m">publisher_id</tspan> and <tspan class="m">channel_id</tspan>.</text>
</svg>
