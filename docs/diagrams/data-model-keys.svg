<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 391" class="nwt-dg" font-family="inherit" role="img">
<title>Keys that join the records</title>
<desc>Market records, INSTRUMENT_DEF, OPTION_DEF, SYMBOL_MAP, LISTING, SECURITY_DEF and CORPORATE_ACTION all meet on the pair publisher_id and instrument_id; VENUE_DEF is keyed by its MIC code.</desc>
<style>.nwt-dg text{font-size:12px;fill:var(--fg-2,#63625d)}.nwt-dg .t{font-size:13px;font-weight:500;fill:var(--fg,#37352f)}.nwt-dg .p{fill:var(--fg,#37352f)}.nwt-dg .q{fill:var(--fg-3,#6b6a65)}.nwt-dg .m{font-family:var(--font-mono,ui-monospace,monospace)}.nwt-dg .e{text-anchor:end}.nwt-dg .c{text-anchor:middle}.nwt-dg rect,.nwt-dg polygon,.nwt-dg circle{fill:var(--panel,#ffffff);stroke:var(--line-2,#d8d7d2)}.nwt-dg .s{fill:var(--bg-2,#f4f3f0)}.nwt-dg .n{fill:none}.nwt-dg .d{stroke-dasharray:4 3}.nwt-dg .f{stroke:var(--fg,#37352f)}.nwt-dg path{fill:none;stroke:var(--fg-3,#6b6a65)}.nwt-dg .h{stroke:var(--line-2,#d8d7d2)}.nwt-dg .k{fill:var(--fg-3,#6b6a65);stroke:none}</style>
<path d="M10.5 79.5H34.5"/>
<path d="M10.5 113.5H34.5"/>
<path d="M10.5 147.5H34.5"/>
<path d="M10.5 181.5H34.5"/>
<path d="M10.5 215.5H34.5"/>
<path d="M10.5 249.5H34.5"/>
<path d="M10.5 283.5H34.5"/>
<path d="M10.5 54V283"/>
<rect class="f" x="0.5" y="0.5" width="279" height="53" rx="3"/>
<text x="10" y="22" class="t"><tspan class="m">publisher_id</tspan> + <tspan class="m">instrument_id</tspan></text>
<text x="10" y="39">the key: one instrument of one publisher</text>
<rect x="34.5" y="66.5" width="179" height="25" rx="3"/>
<text x="44" y="83" class="p">Market records, 12 types</text>
<circle class="k" cx="10.5" cy="79.5" r="2.5"/>
<text x="24" y="75" class="q c m">N</text>
<text x="228" y="83"><tspan class="m">→</tspan> key · needs an earlier <tspan class="m">INSTRUMENT_DEF</tspan></text>
<rect x="34.5" y="100.5" width="179" height="25" rx="3"/>
<text x="44" y="117" class="p m">INSTRUMENT_DEF</text>
<circle class="k" cx="10.5" cy="113.5" r="2.5"/>
<text x="24" y="109" class="q c m">1</text>
<text x="228" y="117"><tspan class="m">#</tspan> key · <tspan class="m">→</tspan> <tspan class="m">underlying_instrument_id</tspan></text>
<rect x="34.5" y="134.5" width="179" height="25" rx="3"/>
<text x="44" y="151" class="p m">OPTION_DEF</text>
<circle class="k" cx="10.5" cy="147.5" r="2.5"/>
<text x="24" y="143" class="q c m">1</text>
<text x="228" y="151"><tspan class="m">#</tspan> key · <tspan class="m">→</tspan> <tspan class="m">underlying_instrument_id</tspan></text>
<rect x="34.5" y="168.5" width="179" height="25" rx="3"/>
<text x="44" y="185" class="p m">SYMBOL_MAP</text>
<circle class="k" cx="10.5" cy="181.5" r="2.5"/>
<text x="24" y="177" class="q c m">N</text>
<text x="228" y="185"><tspan class="m">#</tspan> <tspan class="m">publisher_id</tspan>, <tspan class="m">symbology</tspan>, <tspan class="m">symbol</tspan> · <tspan class="m">→</tspan> key</text>
<rect x="34.5" y="202.5" width="179" height="25" rx="3"/>
<text x="44" y="219" class="p m">CORPORATE_ACTION</text>
<circle class="k" cx="10.5" cy="215.5" r="2.5"/>
<text x="24" y="211" class="q c m">N</text>
<text x="228" y="219"><tspan class="m">#</tspan> <tspan class="m">publisher_id</tspan>, <tspan class="m">unique_id</tspan> · <tspan class="m">→</tspan> key</text>
<rect x="34.5" y="236.5" width="179" height="25" rx="3"/>
<text x="44" y="253" class="p m">SECURITY_DEF</text>
<circle class="k" cx="10.5" cy="249.5" r="2.5"/>
<text x="24" y="245" class="q c m">1</text>
<text x="228" y="253"><tspan class="m">#</tspan> key · <tspan class="m">operating_mic</tspan>, <tspan class="m">segment_mic</tspan></text>
<rect x="34.5" y="270.5" width="179" height="25" rx="3"/>
<text x="44" y="287" class="p m">LISTING</text>
<circle class="k" cx="10.5" cy="283.5" r="2.5"/>
<text x="24" y="279" class="q c m">1</text>
<text x="228" y="287"><tspan class="m">#</tspan> key · <tspan class="m">listing_mic</tspan></text>
<rect x="34.5" y="304.5" width="179" height="25" rx="3"/>
<text x="44" y="321" class="p m">VENUE_DEF</text>
<text x="228" y="321"><tspan class="m">#</tspan> <tspan class="m">publisher_id</tspan>, <tspan class="m">mic</tspan> · matched by MIC code</text>
<text x="0" y="352" class="q"><tspan class="m">#</tspan> key of the record: a later record with the same key replaces the earlier one; <tspan class="m">SYMBOL_MAP</tspan> keeps every interval. <tspan class="m">→</tspan></text>
<text x="0" y="369" class="q">reference to an instrument.</text>
<text x="0" y="386" class="q"><tspan class="m">1</tspan> one current record per instrument, <tspan class="m">N</tspan> many. MIC codes are matched by value; the format does not check them.</text>
</svg>
