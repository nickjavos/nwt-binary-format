<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" role="img" aria-labelledby="nwtd-data-model-keys-w-title nwtd-data-model-keys-w-desc" class="nwt-diagram" font-family="inherit" fill="none">
<title id="nwtd-data-model-keys-w-title">Keys that join the records</title>
<desc id="nwtd-data-model-keys-w-desc">Market records, INSTRUMENT_DEF, OPTION_DEF, SYMBOL_MAP, LISTING, SECURITY_DEF and CORPORATE_ACTION all meet on the pair publisher_id and instrument_id; VENUE_DEF is keyed by its MIC code.</desc>
