<text x="0" y="710" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">#</tspan> key. A later record with the same key replaces the earlier one; <tspan font-family="var(--font-mono, ui-monospace, monospace)">SYMBOL_MAP</tspan> keeps every interval.</text>
<text x="0" y="730" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">→</tspan> refers to an instrument of the same publisher.</text>
<text x="0" y="750" font-size="13" fill="var(--fg-2, #63625d)"><tspan font-family="var(--font-mono, ui-monospace, monospace)">1</tspan> one current record per instrument. <tspan font-family="var(--font-mono, ui-monospace, monospace)">N</tspan> many records per instrument.</text>
<text x="0" y="770" font-size="13" fill="var(--fg-2, #63625d)">Dashed: the same MIC code in both records; the format does not check it.</text>
